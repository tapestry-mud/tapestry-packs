id: "sidestep"
title: "Sidestep"
category: "combat"
role: "player"
keywords: [sidestep, counter, dodge, swell]
brief: "Dodge sideways to counter a telegraphed swell attack."
syntax:
  - "sidestep"
body: |
  Sidestep is a battle counter. When a boss telegraphs a swell attack,
  type sidestep during the window to attempt a counter. The swell clock
  locks in your response and resolves it at the end of the window.

  Only works during active combat when a swell window is open.
see_also: [brace, combat]
