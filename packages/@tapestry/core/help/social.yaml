id: socials
title: Socials
category: communication
keywords: [socials, social, emote]
brief: Social commands let you express emotions and interact with other players.
body: |
  Socials are built-in emote actions you can perform with a single command.
  Each social shows a message to you, a message to the room, and optionally
  a targeted version when you name another player or NPC.

  Use a social by typing its name alone or followed by a target:
    wave
    wave merchant
    bow reginald

  For help on any specific social, type: help <social>
  Example: help wave, help bow, help laugh

  For freeform actions, use emote to write your own.
see_also: [emote]
