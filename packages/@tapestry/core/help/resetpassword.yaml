id: "resetpassword"
title: "Reset Password"
category: "admin"
brief: "Reset a player account's password."
body: |
  Resetpassword sets a new password on a named player account. This
  command requires admin privileges. Use it when a player is locked
  out and cannot recover access on their own.
keywords: [resetpassword, password, reset, admin]
see_also: [admin]
