id: "wimpy"
title: "Wimpy"
category: "combat"
role: "player"
keywords: [auto flee, threshold, safety, hp limit, coward]
brief: "Set HP threshold to automatically flee combat."
syntax:
  - "wimpy"
  - "wimpy [percent]"
  - "wimpy 0"
body: |
  Wimpy sets an HP percentage threshold below which you will automatically
  attempt to flee from combat. This is a critical safety setting for solo
  play.

  Set it with "wimpy [number]" where the number is a percentage from 0 to
  50. When your HP drops to that percentage of your max HP or below during
  combat, a flee attempt fires automatically.

  Use "wimpy 0" to disable automatic fleeing. Use "wimpy" alone to
  see your current setting.
see_also: [flee, kill, combat]
