id: "tune"
title: "Tune"
category: "builder"
role: "builder"
keywords: [tune, dials, swell, builder, boss]
brief: "Inspect or edit swell boss dials live during a playtest session."
syntax:
  - "tune"
  - "tune <dial> <value>"
body: |
  Tune is a builder-only command for live-editing swell boss dials without
  restarting the engine. Must be in combat with a swell boss to use it.

  Bare `tune` prints all current dial values - copy these back into the mob
  YAML when you find settings you like.

  `tune <dial> <value>` sets the named dial in memory for the current session.
  Changes are not persisted; edit the mob YAML to make them permanent.

  Valid dials: swell_tell, swell_baseline_gap_ticks, swell_jitter_ticks,
  swell_telegraph_ticks, swell_window_ticks, swell_mode, swell_chunk_pct,
  swell_whiff_pct, swell_weather_pct.
see_also: [sidestep, brace, combat]
