id: "set"
title: "Set"
category: "admin"
role: "admin"
keywords: [modify, edit, field, property, player, npc, item, noemote, notell, nochannels, hp, mana, admin]
brief: "Modify player, NPC, or item fields directly."
syntax:
  - "set [kind] [attr] [target] [value]"
  - "set player hp [player] [value]"
  - "set player noemote [player] true|false"
body: |
  Set modifies a specific attribute on a player, NPC, or item. The
  attribute comes BEFORE the target: "set player str Bob 14", not
  "set player Bob str 14". Run set with no value to see what is
  settable on a kind.

  Stats: str/int/wis/dex/con/luck set base attributes. hp/mana/mv set
  a player's BASE vital caps - displayed maximums also include class
  and race modifiers, so the in-game number may read higher than the
  base you set. "set npc hp" sets an NPC's hp and max hp together.

  Mutes and flags: declared properties are settable by name, e.g.
  "set player notell Bob true", "set player nochannels Bob true",
  "set player noemote Bob true".

  Changes take effect immediately. Use inspect to see current values
  on a target, and restore to refill vitals after changing caps.
see_also: [inspect, grant, restore, admin]
