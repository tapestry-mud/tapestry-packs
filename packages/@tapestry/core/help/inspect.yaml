id: "inspect"
title: "Inspect"
category: "admin"
role: "admin"
keywords: [view, details, stats, debug, admin, examine deep, room]
brief: "Show detailed stats and properties for an entity or room."
syntax:
  - "inspect [entity]"
  - "inspect room"
  - "inspect room [room-id]"
body: |
  Inspect gives a full detailed readout for an entity or a room.

  For entities (players, NPCs, items): shows all stats, flags,
  equipment, proficiency, active effects, and internal properties.

  For rooms: shows id, name, area, biome, terrain, flags,
  properties, exits, and current occupants.

  Use 'inspect room' to inspect your current room.
  Use 'inspect room <id>' to inspect any room by its full id.

see_also: [set, admin]
