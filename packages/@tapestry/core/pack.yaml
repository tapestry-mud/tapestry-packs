name: "@tapestry/core"
version: "0.1.26"
type: core
display_name: "Tapestry Core"
description: "Engine foundation: recall room, combat, abilities, commands, progression, mob behaviors, socials, and all gameplay systems. Content packs layer areas, races, and classes on top."
author: "Tapestry"
license: "AGPL-3.0"
# Engine floor is documentation-only (the key does not bind). >=0.1.50 is where
# FlowInstance gained entity.scratch; the link/unlink wizards use it for working
# memory, so on older engines those flows would fail (scratch handle absent).
engine: ">=0.1.50"
validation: strict
active: true
load_order: 0

content:
  weather_zones: "areas/weather_zones.yaml"
  area_definitions: "areas/**/area.yaml"
  rooms: "areas/**/rooms/*.yaml"
  items: "areas/**/items/*.yaml"
  equipment_slots: "equipment_slots.yaml"
  scripts: "dist/scripts/**/*.js"
  scripts_format: esm
  strings: "strings/**/*.yaml"
  help: "help/**/*.yaml"
  motd: "data/motd.txt"
  motd_color: "data/motd_color.txt"
