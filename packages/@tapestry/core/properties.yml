properties:
  value:
    description: "Currency value of this item"
    type: int
    applies_to: [item]
  xp_value:
    description: "Experience points awarded when this mob is defeated"
    type: int
    applies_to: [npc]
  text:
    description: "Readable text content for items like letters and signs"
    type: string
    applies_to: [item]
  notell:
    description: "Player is silenced from sending/receiving tells"
    type: bool
    applies_to: [player]
  nochannels:
    description: "Player is silenced from all chat channels"
    type: bool
    applies_to: [player]
  noemote:
    description: "Player is silenced from emotes"
    type: bool
    applies_to: [player]
