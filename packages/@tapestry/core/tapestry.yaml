name: "@tapestry/core"
version: "0.0.10"
type: core
display_name: "Tapestry Core"
description: "Engine foundation: recall room, combat, abilities, commands, progression, mob behaviors, socials, and all gameplay systems. Content packs layer areas, races, and classes on top."
author: "Tapestry"
license: "AGPL-3.0"
engine: ">=0.0.1"
validation: strict
active: true
load_order: 0

content:
  weather_zones: "areas/weather_zones.yaml"
  area_definitions: "areas/**/area.yaml"
  rooms: "areas/**/rooms/*.yaml"
  items: "areas/**/items/*.yaml"
  equipment_slots: "equipment_slots.yaml"
  scripts: "scripts/**/*.js"
  strings: "strings/**/*.yaml"
  help: "help/**/*.yaml"
  motd: "data/motd.txt"
  motd_color: "data/motd_color.txt"
