name: "@tapestry/cooking"
version: "0.1.3"
type: module
display_name: "Tapestry Cooking"
description: "Cook→eat crafting loop: raw ingredients are cooked into food using a pan and heat source (or a self-contained appliance like a microwave). Cooked food grants a well-fed buff via survival interop. An interop testbed — will fold into @tapestry/survival."
author: "Tapestry"
license: "AGPL-3.0"
engine: ">=0.1.5"
validation: strict
dependencies:
  "@tapestry/core": "^0.1.4"
optional_dependencies:
  "@tapestry/survival": "^0.1.1"
active: true
load_order: 6

content:
  scripts: "scripts/**/*.js"
  items: "items/**/*.yaml"
