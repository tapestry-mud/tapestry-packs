id: "tapestry-example-pack:town-square"
area: starter-town
name: "Town Square"
description: >
  You stand in the center of a small town square. Cobblestones stretch
  beneath your feet, worn smooth by countless travelers. A weathered
  <npc>fountain</npc> gurgles quietly in the center. Roads lead in every direction,
  and the sound of commerce drifts from the <direction>east</direction>.
exits:
  north: "tapestry-example-pack:inn"
  south: "tapestry-example-pack:training-grounds"
  east: "tapestry-example-pack:general-store"
  west: "tapestry-example-pack:west-road"
  down: "tapestry-example-pack:mine-entrance"
tags: [safe, recall_point]
properties:
  terrain: outdoors
weather_messages:
  clear:
    start: "The clouds break. Sunlight washes over the streets."
    end: "Clouds gather, dimming the sunlight."
  cloudy:
    start: "Grey clouds settle over the city, muting the light."
    end: "The overcast begins to thin. A little more light reaches the streets."
  rain:
    start: "Rain begins to fall, darkening the cobblestones."
    ongoing: "Rain drums steadily on rooftops and awnings."
    end: "The rain lets up. Puddles dot the streets."
  storm:
    start: "A crack of thunder shakes the city. Rain hammers the cobblestones."
    ongoing: "The storm rages over the city. Lightning flickers between the buildings."
    end: "The storm breaks. The streets shine wet in the returning light."
time_messages:
  dawn: "The first light of morning touches the rooftops. Shutters begin to open."
  day: "The sun climbs high. The streets bustle with activity."
  dusk: "Lanterns flicker to life along the streets as daylight fades."
  night: "The city quiets under a dark sky. Lamplight pools on empty cobblestones."
spawns:
  - mob: "tapestry-example-pack:town-guard"
    count: 1
    tags: [persistent]
  - mob: "tapestry-example-pack:blacksmith"
    count: 1
    tags: [persistent]
fixtures:
  - "tapestry-example-pack:fountain"
  - "tapestry-example-pack:town-sign"
  - "tapestry-example-pack:brass-ring"
  - "tapestry-example-pack:travel-ration"
  - "tapestry-cooking:raw-meat"
