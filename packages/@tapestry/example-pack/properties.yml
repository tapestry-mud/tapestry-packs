properties:
  dialogue:
    description: "Dialogue script reference for NPC conversations"
    type: string
    applies_to: [npc]

  # Swell clock dials - declared so the seal accepts them on npc entities
  swell_window:
    description: "Which info-valve rung opens during a swell window (e.g. telegraph-rung)"
    type: string
    applies_to: [npc]

  swell_tell:
    description: "Tell visibility level: full, shape, or hidden"
    type: string
    applies_to: [npc]

  swell_baseline_gap_ticks:
    description: "Chip-baseline ticks before the next swell begins"
    type: int
    applies_to: [npc]

  swell_jitter_ticks:
    description: "Random +/- tick variance on the baseline gap to prevent scripting"
    type: int
    applies_to: [npc]

  swell_telegraph_ticks:
    description: "Wind-up ticks before the swell window opens"
    type: int
    applies_to: [npc]

  swell_window_ticks:
    description: "Ticks the swell window stays open for a counter attempt"
    type: int
    applies_to: [npc]

  swell_mode:
    description: "Tempo mode applied during the open window (e.g. stretch, hold, wait)"
    type: string
    applies_to: [npc]

  swell_line1_id:
    description: "Internal ID of the first swell move line"
    type: string
    applies_to: [npc]

  swell_line1_counter:
    description: "Counter verb that resolves swell line 1"
    type: string
    applies_to: [npc]

  swell_line1_tell_full:
    description: "Full-tell narration shown to the player when swell line 1 telegraphs"
    type: string
    applies_to: [npc]

  swell_line1_tell_shape:
    description: "Shape-tell narration for swell line 1 (move visible, counter hidden)"
    type: string
    applies_to: [npc]

  swell_line2_id:
    description: "Internal ID of the second swell move line"
    type: string
    applies_to: [npc]

  swell_line2_counter:
    description: "Counter verb that resolves swell line 2"
    type: string
    applies_to: [npc]

  swell_line2_tell_full:
    description: "Full-tell narration shown to the player when swell line 2 telegraphs"
    type: string
    applies_to: [npc]

  swell_line2_tell_shape:
    description: "Shape-tell narration for swell line 2 (move visible, counter hidden)"
    type: string
    applies_to: [npc]

  swell_tell_hidden:
    description: "Narration shown when tell level is hidden and the swell fires"
    type: string
    applies_to: [npc]

  swell_chunk_pct:
    description: "Percent of max HP dealt on a successful swell hit (weathered or whiffed)"
    type: int
    applies_to: [npc]

  swell_whiff_pct:
    description: "Percent chance the swell attack misses entirely on a wrong counter"
    type: int
    applies_to: [npc]

  swell_weather_pct:
    description: "Percent chance the player weathers the blow at reduced damage"
    type: int
    applies_to: [npc]

  swell_narration_countered:
    description: "Narration shown when the player counters the swell successfully"
    type: string
    applies_to: [npc]

  swell_narration_whiffed:
    description: "Narration shown when the swell attack misses (wrong counter, lucky whiff)"
    type: string
    applies_to: [npc]

  swell_narration_weathered:
    description: "Narration shown when the player weathers the swell blow"
    type: string
    applies_to: [npc]
