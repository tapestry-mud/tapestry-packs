name: "@tapestry/builder"
version: "0.2.8"
type: module
display_name: "Tapestry Builder"
description: >
  In-MUD area authoring (OLC). create area / dig / dig-connect / create room /
  edit room / rooms / map. Calls the always-on engine world-authoring API;
  depends on core for link/unlink.
author: "Tapestry"
license: "AGPL-3.0"
engine: ">=0.1.36"
validation: strict
dependencies:
  "@tapestry/core": "^0.1.5"
active: true
load_order: 10
content:
  scripts: "dist/scripts/**/*.js"
  scripts_format: esm
  help: "help/**/*.yaml"
