# Behavior-only base template: NEUTRAL trash mob (stage-B disposition axis).
# No id, name, stats, or fixed identity -- the oracle's override blob supplies those.
# base_disposition: neutral = never attacks on sight; fights back when attacked.
# Disposition is dice-owned per spawn and rides TEMPLATE selection because the
# engine SpawnOverride cannot carry a disposition field.
id: "tapestry-oracle:wary-melee"
name: "a creature"
type: "npc"
tags: []
base_disposition: neutral
keywords: [creature]
behavior: wander
stats:
  strength: 10
  dexterity: 10
  constitution: 10
  intelligence: 4
  wisdom: 4
  luck: 6
  max_hp: 20
  max_resource: 0
  max_movement: 80
properties:
  mob_level: 1
  regen_hp: 1
  regen_movement: 5
  wander_interval: 45
  wander_chance: 0.4
  wander_boundary: "area"
  wimpy_pct: 20
  corpse_decay: 300
  description: "A creature lurks here."
  ac:
    slash: 1
    pierce: 1
    bash: 1
    exotic: 0
