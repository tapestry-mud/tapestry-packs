properties:
  oracle_seed:
    description: >
      The per-player seed for this player's current solo run. Persists across logout/login.
    type: int
    applies_to: [player]
  oracle_runs:
    description: >
      JSON array of the solo runs this player created. One record per run:
      areaId, name, levelRange, roomCount, seed, packName. Powers `solo list`
      and authorizes `solo discard <n>`. Registered so it takes the typed
      persist path on the player file.
    type: string
    applies_to: [player]
  oracle_active_run:
    description: >
      The player's active thread run as a pipe composite "<runAreaId>|<mode>|<entryRoomId>"
      (mode is normal or unraveling), or empty. The composite lets the core death path read
      the run's tier and respawn point without importing oracle's in-memory state; teardown
      splits off the run area id. Cleared to empty on exit.
    type: string
    applies_to: [player]
  oracle_run_template:
    description: >
      The templateId of the player's active thread run. Lets the clear sequence know
      which thread to grant credit for and where to send the player back to.
    type: string
    applies_to: [player]
  oracle_run_return:
    description: >
      The room id the player pulled their active thread from - where they are sent
      back to on a clear or a leave.
    type: string
    applies_to: [player]
  thread_template:
    description: >
      The templateId a thread item is keyed to (spec 7.4). Read by heldThreadFor to
      match a carried thread against the area a player is entering, and by the portal
      to refuse a thread that is not its own. Never set on anything but the thread
      item itself.
    type: string
    applies_to: [item]
