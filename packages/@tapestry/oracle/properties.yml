properties:
  oracle_seed:
    description: >
      The per-player seed for this player's current solo run. Persists across logout/login.
    type: int
    applies_to: [player]
  oracle_runs:
    description: >
      JSON array of the solo runs this player created. One record per run:
      areaId, name, levelRange, roomCount, seed, packName. Powers `solo list`
      and authorizes `solo discard <n>`. Registered so it takes the typed
      persist path on the player file.
    type: string
    applies_to: [player]
  tapestry_unlocked:
    description: >
      Set true when the player finishes the school thread. Gates access to the
      Tapestry board (the real threads). The one v1 trophy - functional, not cosmetic.
    type: bool
    applies_to: [player]
  oracle_active_run:
    description: >
      The player's active thread run as a pipe composite "<runAreaId>|<deathMode>|<entryRoomId>"
      (deathMode is grind or unraveling), or empty. The composite lets the core death path read
      the run's tier and respawn point without importing oracle's in-memory state; teardown
      splits off the run area id. Cleared to empty on exit.
    type: string
    applies_to: [player]
