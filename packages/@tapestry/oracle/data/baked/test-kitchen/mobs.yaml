    - { w: 60, id: mb-common-angry-cook, name: "angry cook", desc: "Red-faced, ladle raised.", balance_ref: mob }
    - { w: 40, id: mb-common-waiter-wraith, name: "waiter wraith", desc: "It glides with a tray it will never set down.", balance_ref: mob }
    - { w: 50, id: mb-hunter-sauciers-shade, name: "saucier's shade", desc: "It stirs a pot of something that watches back.", balance_ref: mob }
    - { w: 50, id: mb-hunter-carving-dervish, name: "carving-knife dervish", desc: "A whirl of edges looking for a roast.", balance_ref: mob }
    - { w: 40, id: mb-apex-tandoor-beast, name: "tandoor beast", desc: "Heat rolls off it in oven waves.", balance_ref: mob }
