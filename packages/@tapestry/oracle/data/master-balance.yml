# Anchor-based curve. Levels 1-60; interpolate between the listed anchors.
# Numeric fields interpolate continuously; dice-notation fields snap to the nearest anchor.
#
# 2026-07-04 B.2 low-level retune (targets agreed with Travis; pinned player
# model = geared skill-less level 1: avg weapon ~6.5 dmg/hit, ~55-60% hit rate):
#   trash 3-4 rounds to kill at L1 (2d10, avg 11); trash damage 1d6 at L1;
#   elite 8-10 rounds (~27 avg HP); miniboss a real fight (~60 HP);
#   boss curve untouched - the swell chunk (15% of boss maxHp per countered
#   swell, template dial) is what kills a 200 HP L1 boss (~7 clean counters),
#   never attrition. L1/L10 anchors rescaled together (L10 proportional);
#   the 20/40/60 anchors are unchanged. wimpy_pct 0 at L1 - low-level trash
#   must not flee from new players - interpolating back to the old curve by
#   L10 (trash templates carry wimpy_pct 0 because SpawnOverride cannot carry
#   wimpy; all solo trash currently mints at L1, so template == L1 anchor).
mob:
  anchors: [1, 10, 20, 40, 60]
  hp_count:   [2, 5, 26, 60, 120]      # NdM with M=10 -> dice count interpolates
  hp_die: 10
  damage:                               # snapped to nearest anchor band
    1:  [{ w: 100, value: "1d6" }]
    10: [{ w: 60, value: "3d8" }, { w: 40, value: "2d12" }]
    20: [{ w: 60, value: "5d8" }, { w: 40, value: "4d10" }]
    40: [{ w: 60, value: "8d10" }, { w: 40, value: "6d12" }]
    60: [{ w: 60, value: "12d10" }, { w: 40, value: "10d12" }]
  wimpy_pct: [0, 20, 18, 15, 12]
weapon:
  anchors: [1, 10, 20, 40, 60]
  damage:
    1:  [{ w: 60, value: "2d6" }, { w: 40, value: "1d12" }]
    10: [{ w: 60, value: "3d8" }, { w: 40, value: "2d12" }]
    20: [{ w: 60, value: "4d10" }, { w: 40, value: "3d12" }]
    40: [{ w: 60, value: "6d12" }, { w: 40, value: "5d16" }]
    60: [{ w: 60, value: "9d12" }, { w: 40, value: "8d16" }]
  max_hp: [5, 12, 25, 55, 100]
armor:
  anchors: [1, 10, 20, 40, 60]
  ac:    [-1, -3, -5, -9, -14]          # interpolates continuously, rounded to int
  max_hp: [3, 8, 18, 40, 75]
  slots:
    1:  [head, hands, feet]
    10: [head, hands, feet, body]
    20: [head, hands, feet, body, wrist]
    40: [head, hands, feet, body, wrist, waist]
    60: [head, hands, feet, body, wrist, waist, neck]
boss:
  anchors: [1, 10, 20, 40, 60]
  hp:     [200, 700, 1600, 4200, 9000]  # interpolates continuously
  damage:
    1:  [{ w: 100, value: "2d10" }]
    10: [{ w: 100, value: "3d12" }]
    20: [{ w: 100, value: "5d12" }]
    40: [{ w: 100, value: "8d12" }]
    60: [{ w: 100, value: "12d12" }]
# Stage-B threat tiers. elite = charged-band swell-capable mob (~2x trash hp,
# a die-size up on damage); miniboss = the landmark structural fight (between
# elite and boss). Swell DIALS are template data (swell-elite / swell-miniboss
# templates) because spawn overrides cannot carry properties; only hp/damage
# roll from here - balance stays dice-owned.
elite:
  anchors: [1, 10, 20, 40, 60]
  hp_count:   [5, 10, 52, 120, 240]     # NdM with M=10, like mob (B.2: L1/L10 rescaled, ~2x trash)
  hp_die: 10
  damage:
    1:  [{ w: 100, value: "1d10" }]
    10: [{ w: 100, value: "3d10" }]
    20: [{ w: 100, value: "5d10" }]
    40: [{ w: 100, value: "8d12" }]
    60: [{ w: 100, value: "12d12" }]
# 2026-07-27 gear-carries-HP (design decision, Travis): FIRST-PASS values.
# Tune during the week-one retune (playtest gate) before flip - these are
# not balanced against real playtest data yet. Armor rolls a smaller
# PER-PIECE amount (up to 7 worn pieces stack at the top band); weapon
# rolls more since only one wield slot exists.
miniboss:
  anchors: [1, 10, 20, 40, 60]
  hp:     [60, 210, 750, 2000, 4200]    # interpolates continuously (B.2: L1/L10 rescaled)
  damage:
    1:  [{ w: 100, value: "2d8" }]
    10: [{ w: 100, value: "3d10" }]
    20: [{ w: 100, value: "4d12" }]
    40: [{ w: 100, value: "7d12" }]
    60: [{ w: 100, value: "10d12" }]
# Boss swell dials: kept as the v1 clamped 5-rank table. The combat spec owns the 1-60 curve.
boss_swell:
  1: { swell_baseline_gap_ticks: 80, swell_jitter_ticks: 20, swell_telegraph_ticks: 20, swell_window_ticks: 60, swell_chunk_pct: 12, swell_whiff_pct: 8, swell_weather_pct: 6 }
  2: { swell_baseline_gap_ticks: 70, swell_jitter_ticks: 20, swell_telegraph_ticks: 18, swell_window_ticks: 55, swell_chunk_pct: 14, swell_whiff_pct: 8, swell_weather_pct: 6 }
  3: { swell_baseline_gap_ticks: 65, swell_jitter_ticks: 18, swell_telegraph_ticks: 16, swell_window_ticks: 50, swell_chunk_pct: 16, swell_whiff_pct: 9, swell_weather_pct: 7 }
  4: { swell_baseline_gap_ticks: 60, swell_jitter_ticks: 16, swell_telegraph_ticks: 14, swell_window_ticks: 45, swell_chunk_pct: 18, swell_whiff_pct: 9, swell_weather_pct: 7 }
  5: { swell_baseline_gap_ticks: 55, swell_jitter_ticks: 15, swell_telegraph_ticks: 12, swell_window_ticks: 40, swell_chunk_pct: 20, swell_whiff_pct: 10, swell_weather_pct: 8 }
# Rarity tiers: a level-equivalent bump applied on top of the item's band before the stat roll.
rarity:
  junk:    -1
  common:   0
  uncommon: 1
  rare:     2
  epic:     3
