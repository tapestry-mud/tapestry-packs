name: "@tapestry/biomes"
version: "0.1.2"
type: module
display_name: "Tapestry Biomes"
description: >
  Shared world vocabulary for biomes and terrain types. A thin layer of room tags
  that content packs target -- for distribution (e.g. tinkers scatters wood into
  forest), behavior, or flavor. Lean by design; add tags when content uses them.
author: "Tapestry"
license: "AGPL-3.0"
engine: ">=0.1.7"
validation: strict
dependencies:
  "@tapestry/core": "^0.1.4"
active: true
load_order: 5

content:
  area_definitions: "areas/**/area.yaml"
  rooms: "areas/**/rooms/*.yaml"
  items: "items/**/*.yaml"
  scripts: "scripts/**/*.js"
