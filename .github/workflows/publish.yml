name: Publish Changed Packs

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install tapestry CLI
        run: npm install -g @tapestry-mud/cli

      - name: Publish changed packs
        env:
          REGISTRY_CI_TOKEN: ${{ secrets.REGISTRY_CI_TOKEN }}
          TAPESTRY_REGISTRY: https://registry.tapestryengine.com
        run: node scripts/publish-changed.js
