name: Publish Changed Packs

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        # No git diff needed: publish-changed.js compares manifest versions to the registry.

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install tapestry CLI
        run: npm install -g @tapestry-mud/cli

      - name: Validate pack manifests
        run: npm test

      - name: Publish changed packs
        env:
          TAPESTRY_REGISTRY: https://registry.tapestryengine.com
        run: node scripts/publish-changed.js
